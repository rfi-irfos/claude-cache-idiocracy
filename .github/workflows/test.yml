name: test
on: [push, pull_request]
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip pytest
      - run: python -m pip install .
      - run: python -m pytest -q
      - run: python scripts/hache-token-benchmark.py
      - run: python scripts/hache-benchmark.py
      - run: python scripts/hache-lifecycle-smoke.py
      - name: exercise installer (Unix)
        if: runner.os != 'Windows'
        env:
          HACHE_REPO: ${{ github.workspace }}
          HACHE_DIR: ${{ runner.temp }}/hache-install
        run: sh install.sh --all
      - name: exercise installer (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          HACHE_REPO: ${{ github.workspace }}
          HACHE_DIR: ${{ runner.temp }}\hache-install
        run: ./install.ps1 -All
